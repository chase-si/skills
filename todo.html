<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>待办清单</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --surface: #fff;
      --text: #1a1a1a;
      --muted: #5c6370;
      --border: #d8dde4;
      --accent: #2563eb;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121418;
        --surface: #1c1f26;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --border: #2f3542;
        --accent: #60a5fa;
        --danger: #f87171;
        --danger-bg: #2a1515;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1.25rem;
      letter-spacing: -0.02em;
    }
    .add-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .add-row input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
    }
    .add-row input[type="text"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.6rem 0.9rem;
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
    }
    button.danger {
      border-color: transparent;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 0.35rem 0.6rem;
      font-size: 0.875rem;
    }
    button.danger:hover {
      filter: brightness(0.95);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    li {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }
    li input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    li .label-wrap {
      flex: 1;
      min-width: 0;
    }
    li label {
      cursor: pointer;
      word-break: break-word;
    }
    li.done label {
      text-decoration: line-through;
      opacity: 0.65;
    }
    .empty {
      color: var(--muted);
      font-size: 0.9375rem;
      padding: 1rem 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>待办清单</h1>
    <form class="add-row" id="add-form" autocomplete="off">
      <input
        type="text"
        id="new-text"
        name="text"
        placeholder="输入任务，按 Enter 或点「添加」"
        maxlength="500"
        aria-label="新任务"
      />
      <button type="submit" class="primary">添加</button>
    </form>
    <ul id="list" aria-live="polite"></ul>
    <p class="empty" id="empty-hint" hidden>暂无任务，在上方添加一条吧。</p>
  </main>
  <script>
    (function () {
      var STORAGE_KEY = "todo-items-v1";

      /** @type {{ id: string, text: string, done: boolean }[]} */
      var items = [];

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            items = [];
            return;
          }
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            items = [];
            return;
          }
          items = parsed.filter(function (row) {
            return (
              row &&
              typeof row.id === "string" &&
              typeof row.text === "string" &&
              typeof row.done === "boolean"
            );
          });
        } catch (e) {
          items = [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function newId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        return String(Date.now()) + "-" + String(Math.random()).slice(2, 10);
      }

      var listEl = document.getElementById("list");
      var emptyHint = document.getElementById("empty-hint");
      var formEl = document.getElementById("add-form");
      var inputEl = document.getElementById("new-text");

      function render() {
        listEl.innerHTML = "";
        emptyHint.hidden = items.length > 0;

        items.forEach(function (item) {
          var li = document.createElement("li");
          li.className = item.done ? "done" : "";
          li.dataset.id = item.id;

          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.setAttribute("aria-label", "标记完成：" + item.text);
          cb.addEventListener("change", function () {
            item.done = cb.checked;
            li.className = item.done ? "done" : "";
            save();
          });

          var wrap = document.createElement("div");
          wrap.className = "label-wrap";
          var label = document.createElement("label");
          label.htmlFor = "cb-" + item.id;
          label.textContent = item.text;
          cb.id = "cb-" + item.id;
          wrap.appendChild(label);

          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "danger";
          delBtn.textContent = "删除";
          delBtn.setAttribute("aria-label", "删除：" + item.text);
          delBtn.addEventListener("click", function () {
            items = items.filter(function (x) {
              return x.id !== item.id;
            });
            save();
            render();
          });

          li.appendChild(cb);
          li.appendChild(wrap);
          li.appendChild(delBtn);
          listEl.appendChild(li);
        });
      }

      formEl.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = (inputEl.value || "").trim();
        if (!text) return;
        items.push({ id: newId(), text: text, done: false });
        inputEl.value = "";
        save();
        render();
        inputEl.focus();
      });

      load();
      render();
    })();
  </script>
</body>
</html>
